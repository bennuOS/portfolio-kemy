<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>Kemy Rojas | Portafolio</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b0b;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(460px,100%);text-align:center}
.brand{font-size:13px;letter-spacing:7px;text-transform:uppercase;color:#999;margin-bottom:50px}
h1{font-size:42px;line-height:1;margin:0 0 12px;font-weight:700}
.role{color:#aaa;font-size:17px;margin:0 0 12px}
.desc{color:#777;line-height:1.55;margin:0 auto 38px;max-width:390px}
.links{display:grid;gap:14px}
a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;padding:19px 21px;border-radius:14px;font-weight:700;transition:.2s}
.primary{background:#f4f4f4;color:#0b0b0b}
.secondary{border:1px solid #333;color:#f4f4f4;background:#141414}
a:hover{transform:translateY(-2px)}
.arrow{font-size:22px}
footer{margin-top:45px;color:#555;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">BENNU</div>
  <h1>Kemy Rojas</h1>
  <p class="role">Diseñador Gráfico</p>
  <p class="desc">Diseño, creatividad y comunicación visual para transformar ideas en experiencias de marca.</p>
  <div class="links">
    <a class="primary" href="https://www.behance.net/kemyrojas" target="_blank" rel="noopener">
      <span>Ver portafolio en Behance</span><span class="arrow">↗</span>
    </a>
    <a class="secondary" href="https://www.instagram.com/bennuagency_/" target="_blank" rel="noopener">
      <span>Bennu Agency · Instagram</span><span class="arrow">↗</span>
    </a>
  </div>
  <footer>BENNU · CREA · CONECTA · IMPULSA</footer>
</main>
</body>
</html>
